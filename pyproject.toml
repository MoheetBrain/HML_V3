[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hml-v3"
version = "0.1.0"
description = "Evidence-first mathematical representation discovery system"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
# Without this, a bare `pytest` collects the vendored Lean/LeanDojo checkouts under
# external/ and dies on their imports, which reads as a broken test suite.
testpaths = ["tests"]
